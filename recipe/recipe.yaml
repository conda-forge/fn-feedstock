schema_version: 1

context:
  name: fn
  version: "0.4.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fn-${{ version }}.tar.gz
  sha256: f8cd80cdabf15367a2f07e7a9951fdc013d7200412743d85b88f2c896c95bada
  patches:
    - collections.patch

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fn
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Implementation of missing features to enjoy functional programming in Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/kachayev/fn.py

extra:
  recipe-maintainers:
    - jan-janssen
